<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radigene</title>
<meta name="description" content="Radigene B.V. is a Dutch preclinical company developing imaging to make engineered cell therapies visible in the body.">
<link rel="icon" href="assets/favicon-64.png">
<link rel="canonical" href="https://radigene.nl/">
<style>
:root{--bg:#F4F6F8;--ink:#0A141C;--muted:#44545F;--accent:#1479C9;--line:#DAE2E8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;margin:0 auto;padding:48px 24px}
img{width:120px;height:auto;margin-bottom:32px}
h1{font-size:2rem;line-height:1.2;margin:0 0 16px}
p{margin:0 0 16px;color:var(--muted)}
a{color:var(--accent)}
footer{padding:24px;text-align:center;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <img src="assets/logo-full.png" alt="Radigene logo" width="120" height="107">
  <h1>Making engineered cell therapies visible in the body.</h1>
  <p>Radigene B.V. is a Dutch preclinical company developing a reporter gene and a PET tracer to image engineered cells.</p>
  <p>Contact: <a href="mailto:hello@radigene.nl">hello@radigene.nl</a></p>
</main>
<footer>Radigene B.V. Preclinical. Investigational. Not used in patients. Not a medical device.</footer>
</body>
</html>
